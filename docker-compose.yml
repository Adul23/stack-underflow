name: stack-underflow

services:
  backend:
    build: ./backend
    container_name: stack-underflow-backend
    command: daphne -b 0.0.0.0 -p 8000 stack_underflow.asgi:application
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      STACK_UNDERFLOW_REDIS_HOST: redis
      STACK_UNDERFLOW_CHANNELS_REDIS_HOST: redis
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: stack-underflow-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${DB_NAME:-stack_underflow}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stack-underflow-redis
    ports:
      - "6379:6379"

  celery_worker:
    build: ./backend
    container_name: stack-underflow-worker
    command: celery -A stack_underflow.celery:app worker -l info
    volumes:
      - ./backend:/app
    working_dir: /app
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      STACK_UNDERFLOW_REDIS_HOST: redis
      STACK_UNDERFLOW_CHANNELS_REDIS_HOST: redis
    depends_on:
      - redis
      - db

volumes:
  db_data:
