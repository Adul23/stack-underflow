name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      STACK_UNDERFLOW_ENV_ID: local
      STACK_UNDERFLOW_SECRET_KEY: ci-only-disposable-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: stack_underflow.env.local
      DB_NAME: stack_underflow
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      USE_REDIS: "False"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stack_underflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stack_underflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements/base.txt
      - name: Lint backend
        run: python -m ruff check .
      - name: Test backend against PostgreSQL
        # The legacy Channels prototype requires Redis and is outside the MVP.
        run: python -m pytest --ignore=tests/ChannelsTests.py -q
      - name: Build backend Docker image
        run: docker build --tag stack-underflow:ci .

  frontend:
    name: Angular build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Match the existing Angular 14 development setup.
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Angular app
        run: npm run build
