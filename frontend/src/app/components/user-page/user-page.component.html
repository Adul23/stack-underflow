<div *ngIf="user" class="user-profile-container">
    <button (click)="back()" class="btn btn-outline-primary mb-4">← Back</button>

    <div class="profile-card">
        <div class="profile-avatar">
            {{ user.first_name[0] }}{{ user.last_name[0] }}
        </div>
        <h4 class="name">{{ user.first_name }} {{ user.last_name }}</h4>
        <p class="email">{{ user.email }}</p>
    </div>

    <ul class="nav nav-tabs mt-4">
        <li class="nav-item">
            <button class="nav-link" [class.active]="activeTab === 'questions'" (click)="setTab('questions')">
                Questions ({{ userQuestions.length }})
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" [class.active]="activeTab === 'comments'" (click)="setTab('comments')">
                Comments ({{ userComments.length }})
            </button>
        </li>
    </ul>

    <div *ngIf="activeTab === 'questions'" class="mt-3">
        <div *ngFor="let question of userQuestions" class="question-card">
            <a [routerLink]="['/questions', question.slug]" class="question-link">
                <h5>{{ question.title }}</h5>
                <small class="date">{{ question.created_at | date: 'HH:mm, dd/MM/yyyy' }}</small>
            </a>
        </div>
        <p *ngIf="userQuestions.length == 0" class="text-muted mt-2">No questions yet.</p>
    </div>

    <div *ngIf="activeTab === 'comments'" class="mt-3">
        <div *ngFor="let comment of userComments" class="comment-card">
            <p class="comment-text">{{ comment.text }}</p>
            <small class="date">{{ comment.created_at | date: 'HH:mm, dd/MM/yyyy' }}</small>
        </div>
        <p *ngIf="userComments.length === 0" class="text-muted mt-2">No comments yet.</p>
    </div>
</div>
